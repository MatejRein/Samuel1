<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biblická výzva – živý kvíz</title><style>
:root{color-scheme:dark;--bg:#170f42;--panel:#30206b;--yellow:#ffdf55}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 90% 0,#683dc1,transparent 36%),radial-gradient(circle at 10% 90%,#154f87,transparent 40%),var(--bg);color:#fff;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}main{width:min(1050px,100%);margin:auto;padding:16px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 0 18px}.brand{font-size:clamp(19px,3vw,26px);font-weight:950}.brand span{color:var(--yellow)}.panel{padding:clamp(18px,4vw,38px);border-radius:26px;background:#2a1c6bdc;border:1px solid #ffffff33;box-shadow:0 20px 70px #08052255}.center{text-align:center}.hide{display:none!important}.kicker{color:var(--yellow);text-transform:uppercase;letter-spacing:2px;font-weight:900;font-size:12px}h1{font-size:clamp(34px,6vw,65px);line-height:1.08;margin:12px 0 18px}h2{font-size:clamp(25px,4vw,42px);line-height:1.15;margin:14px 0 20px}.muted{color:#e3dcff;line-height:1.5}.button{background:var(--yellow);color:#201149;border:0;border-radius:14px;padding:15px 24px;font-size:18px;font-weight:950;cursor:pointer;box-shadow:0 5px 0 #bda43e}.button.alt{background:#fff;box-shadow:none}.button:disabled{opacity:.55;cursor:not-allowed}.buttons{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:20px}input{width:min(380px,100%);font:inherit;padding:15px;border-radius:12px;border:3px solid transparent;color:#19123a;background:#fff;font-weight:800}input:focus{outline:3px solid #ffdf55}.stack{display:flex;flex-direction:column;align-items:center;gap:12px}.pin{font-size:clamp(52px,10vw,100px);font-weight:1000;letter-spacing:8px;color:var(--yellow);margin:8px}.join{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}.qr{max-width:290px;width:100%;background:white;border-radius:18px;padding:10px}.badge{display:inline-block;background:#ffffff25;border-radius:99px;padding:9px 14px;font-weight:800}.names{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:16px 0}.name{background:#ffffff20;padding:9px 12px;border-radius:8px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:850;flex-wrap:wrap}.timer{border-radius:999px;width:76px;height:76px;background:var(--yellow);color:#251455;display:grid;place-items:center;font-weight:1000;font-size:34px;margin:auto}.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.answer{display:flex;gap:14px;align-items:center;text-align:left;min-height:100px;border:0;border-radius:14px;padding:17px;color:#fff;font-size:clamp(17px,2.5vw,25px);font-weight:850;cursor:pointer;box-shadow:inset 0 -5px #0003}.answer b{font-size:32px}.answer:nth-child(1){background:#df3151}.answer:nth-child(2){background:#2879dd}.answer:nth-child(3){background:#cb950a}.answer:nth-child(4){background:#14966a}.answer:disabled{opacity:.65}.answer.selected{outline:5px solid white;opacity:1}.line{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;background:#ffffff20;border-radius:11px;margin:7px 0}.line:first-child{background:#ffdc58;color:#211246;font-weight:1000}.small{font-size:14px}.error{color:#ffbbc5;min-height:23px;font-weight:750}.good{color:#aeffce}.footer{margin-top:24px;text-align:center;color:#c7bdeb;font-size:12px}.spaced{margin:18px 0}.num{font-size:42px;font-weight:1000;color:var(--yellow)}@media(max-width:650px){.join{grid-template-columns:1fr}.answers{grid-template-columns:1fr;gap:10px}.answer{min-height:75px}.pin{letter-spacing:4px}.panel{border-radius:19px}}
</style></head><body><main><header><div class="brand">⚡ BIBLICKÁ <span>VÝZVA!</span></div><span id="status" class="small">Pripájanie…</span></header><div id="root"></div><div class="footer">Lectio divina • Biblia • prorok Samuel • 10 otázok</div></main><script src="/socket.io/socket.io.js"></script><script>
'use strict';const socket=io({reconnection:true});const root=document.getElementById('root');const status=document.getElementById('status');let role='start',pin='',token='',playerId='',playerName='',state=null,qr='',joinUrl='',selected=null,lastAnswer=null,clock=null;const signs=['▲','◆','●','■'];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const getPin=()=>new URLSearchParams(location.search).get('pin')||'';const saved=()=>{try{return JSON.parse(sessionStorage.getItem('biblical-session'))||{}}catch{return {}}};function store(){sessionStorage.setItem('biblical-session',JSON.stringify({role,pin,token,playerId,playerName,qr,joinUrl}))}const panel=html=>`<section class="panel">${html}</section>`;const say=s=>{const e=document.querySelector('#error');if(e)e.textContent=s};const button=(label,id,alt=false)=>`<button class="button ${alt?'alt':''}" id="${id}">${label}</button>`;
function showStart(){role='start';root.innerHTML=panel(`<div class="center"><div class="kicker">Živá biblická súťaž</div><h1>Kto dnes získa<br>biblický titul? 🎉</h1><p class="muted">10 veselých otázok • QR kód pre súťažiacich • odpovede na mobiloch • spoločný rebríček</p><div class="buttons">${button('🎤 Som moderátor','make')}${button('📱 Som súťažiaci','joinview',true)}</div><p class="error" id="error"></p></div>`);document.querySelector('#make').onclick=()=>socket.emit('create',r=>{if(!r.ok)return say(r.error);role='host';pin=r.pin;token=r.token;qr=r.qr;joinUrl=r.joinUrl;store();render()});document.querySelector('#joinview').onclick=()=>joinForm(getPin())}
function joinForm(initial=''){role='joinform';root.innerHTML=panel(`<div class="center stack"><div class="kicker">Pripoj sa do hry</div><h1>Vitaj, súťažiaci! 📱</h1><input id="pin" inputmode="numeric" maxlength="6" placeholder="6-miestny PIN" value="${esc(initial)}"><input id="nickname" maxlength="25" placeholder="Tvoja prezývka" value="${esc(playerName)}">${button('🚀 Vstúpiť do hry','join')}<p class="error" id="error"></p></div>`);document.querySelector('#join').onclick=()=>{const p=document.querySelector('#pin').value.trim(),name=document.querySelector('#nickname').value.trim();socket.emit('join',{pin:p,name,playerId:(p===pin&&name===playerName)?playerId:null},r=>{if(!r.ok)return say(r.error);role='player';pin=p;playerName=name;playerId=r.playerId;store();render()})}}
function ranking(){return `<div class="spaced">${(state?.ranking||[]).map((p,i)=>`<div class="line"><span>${i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.'} ${esc(p.name)}</span><b>${p.score} b.</b></div>`).join('')||'<p class="muted">Zatiaľ bez hráčov.</p>'}</div>`}
function host(){if(!state)return;let html='';if(state.phase==='lobby'){html=`<div class="center"><div class="kicker">Moderátor • čakáreň</div><h1>Pripojte sa do hry! 🎉</h1><div class="join"><div><div class="muted">PIN hry</div><div class="pin">${pin}</div><p class="muted small">Naskenujte QR kód alebo zadajte PIN na stránke:</p><p style="overflow-wrap:anywhere">${esc(joinUrl)}</p><div class="badge">👥 Prihlásení: ${state.count}</div></div><div><img class="qr" src="${qr}" alt="QR kód na pripojenie do kvízu"></div></div><div class="names">${state.players.map(p=>`<span class="name">${esc(p.name)}${p.connected?'':' (offline)'}</span>`).join('')}</div><div class="buttons">${button('▶️ Začať súťaž','next')}</div></div>`}else if(state.phase==='question'){html=`<div class="top"><span>OTÁZKA ${state.index+1} / ${state.total}</span><span>👥 Odpovedalo ${state.answered}/${state.count}</span></div><h2 class="center">${esc(state.question.q)}</h2><div class="timer" id="timer">20</div><div class="answers">${state.question.a.map((a,i)=>`<div class="answer"><b>${signs[i]}</b><span>${esc(a)}</span></div>`).join('')}</div><p class="center muted">Súťažiaci odpovedajú na svojich mobiloch.</p>`}else if(state.phase==='results'){html=`<div class="center"><div class="kicker">Správna odpoveď</div><h2>✅ ${esc(['▲','◆','●','■'][state.result.correct])} ${esc(['A','B','C','D'][state.result.correct])}</h2><p class="muted">${esc(state.result.why)}</p><div class="badge">Odpovedalo ${state.result.answers} hráčov</div><h2>🏆 Aktuálny rebríček</h2>${ranking()}<div class="buttons">${button(state.index===state.total-1?'🏁 Ukončiť hru':'➡️ Ďalšia otázka','next')}</div></div>`}else{html=`<div class="center"><div class="kicker">Veľké finále 🎊</div><h1>Gratulujeme víťazom!</h1><h2>🏆 Konečný rebríček</h2>${ranking()}<p class="muted">Ďakujeme všetkým za hru!</p></div>`}root.innerHTML=panel(html);const b=document.querySelector('#next');if(b)b.onclick=()=>socket.emit('host:next',{pin,token},r=>{if(!r.ok)alert(r.error||'Akcia sa nepodarila')});updateClock()}
function player(){if(!state)return;let html='';if(state.phase==='lobby'){html=`<div class="center"><div class="kicker">Si v hre!</div><h1>Ahoj, ${esc(playerName)}! 👋</h1><p class="muted">Čakáme, kým moderátor spustí kvíz.</p><div class="badge">👥 ${state.count} hráčov</div></div>`}else if(state.phase==='question'){html=`<div class="top"><span>OTÁZKA ${state.index+1} / ${state.total}</span><span>🏅 ${esc(playerName)}</span></div><h2 class="center">${esc(state.question.q)}</h2><div class="timer" id="timer">20</div>${selected===state.index?`<div class="center"><h2>✅ Odpoveď odoslaná!</h2><p class="muted">Počkaj na ostatných.</p></div>`:`<div class="answers">${state.question.a.map((a,i)=>`<button class="answer" data-a="${i}"><b>${signs[i]}</b><span>${esc(a)}</span></button>`).join('')}</div>`}`}else if(state.phase==='results'){html=`<div class="center"><div class="kicker">Vyhodnotenie</div><h1>${lastAnswer?.index===state.index?(lastAnswer.correct?'🎉 Správne!':'🙃 Nabudúce!'):'📖 Dozvedeli sme sa…'}</h1><h2>${esc(state.result.why)}</h2><p class="muted">Správna odpoveď: ${esc(['▲','◆','●','■'][state.result.correct])} ${esc(['A','B','C','D'][state.result.correct])}</p><h2>🏆 Rebríček</h2>${ranking()}</div>`}else{html=`<div class="center"><h1>🎊 Koniec hry!</h1><h2>🏆 Konečné poradie</h2>${ranking()}</div>`}root.innerHTML=panel(html);document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const choice=+b.dataset.a;document.querySelectorAll('[data-a]').forEach(x=>x.disabled=true);socket.emit('answer',{choice},r=>{if(!r.ok){alert(r.error);return}selected=state.index;lastAnswer={index:state.index,correct:r.correct};render()})});updateClock()}
function updateClock(){clearInterval(clock);const tick=()=>{const t=document.querySelector('#timer');if(t&&state?.endsAt)t.textContent=Math.max(0,Math.ceil((state.endsAt-Date.now())/1000))};tick();clock=setInterval(tick,250)}
function render(){if(role==='host')host();if(role==='player')player()}
socket.on('connect',()=>{status.textContent='🟢 Pripojené';const s=saved();if(s.role==='host'&&s.pin&&s.token){role='host';pin=s.pin;token=s.token;qr=s.qr;joinUrl=s.joinUrl;socket.emit('host:resume',{pin,token},r=>{if(!r.ok){sessionStorage.removeItem('biblical-session');showStart()}})}else if(s.role==='player'&&s.pin&&s.playerId){role='player';pin=s.pin;playerId=s.playerId;playerName=s.playerName;socket.emit('join',{pin,name:playerName,playerId},r=>{if(!r.ok){sessionStorage.removeItem('biblical-session');joinForm(pin)}})}else if(role==='start'||role==='joinform'){if(getPin())joinForm(getPin());else showStart()}});socket.on('disconnect',()=>{status.textContent='🔴 Obnovuje sa spojenie…'});socket.on('state',s=>{if(s.pin!==pin)return;const changed=state?.index!==s.index||state?.phase!==s.phase;if(state?.index!==s.index)selected=null;state=s;if(role==='host'||role==='player'){if(changed||s.phase==='lobby'||s.phase==='results'||s.phase==='finished')render();else{const count=document.querySelector('.top span:last-child');if(role==='host'&&count)count.textContent=`👥 Odpovedalo ${s.answered}/${s.count}`}}});socket.on('closed',()=>{sessionStorage.removeItem('biblical-session');state=null;alert('Moderátor ukončil hru.');showStart()});if(!socket.connected){if(getPin())joinForm(getPin());else showStart()}
</script></body></html>
